[project]
name = "planb"
version = "0.1.0"
description = "Boundary-conditioned flow matching for floorplan reverse design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "torchcfm>=1.0.7,<2",
]
dev = [
    "anyschedule",
    "lance",
    "ortools",
    "pytest>=8.0",
    "scikit-learn>=1.4",
]
eval = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "transformers>=4.57",
]
synthetic = [
    "shapely>=2.1",
    "skia-python>=140",
]
vector = [
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "skan>=0.13",
    "shapely>=2.1",
]
code-ast = [
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-cpp==0.23.4",
]
external = [
    "blobfile>=3.0",
    "cairosvg>=2.7",
    "drawSvg>=1.9",
    "matplotlib>=3.8",
    "mpi4py>=4.0",
    "networkx>=3.2",
    "pytorch-fid>=0.3",
    "svgwrite>=1.4",
    "torchvision>=0.17",
    "webcolors>=24.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "third_party/Trinity/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
